services:
  # Backend API Service
  - type: web
    name: rockfall-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.perfect_backend:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: PORT
        value: "10000"
    autoDeploy: true
    plan: free

  # Frontend Static Site
  - type: web
    name: rockfall-frontend
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/build
    envVars:
      - key: REACT_APP_API_URL
        value: https://rockfall-backend.onrender.com
    autoDeploy: true
    plan: free
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
